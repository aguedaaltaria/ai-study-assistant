<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Principal - StudyAI</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <main class="contenedor-principal" style="max-width: 600px; text-align: left;">
        <h1 style="text-align: left; color: var(--color-primary);">Panel de Control</h1>
        <p style="margin-bottom: 1.5rem; color: var(--color-text-muted);">Bienvenido a tu espacio de estudio protegido por sesión.</p>
        <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
            <a href="/cuestionario" class="boton-primario" style="text-align: center; text-decoration: none;">Ir a Cuestionario</a>
            <a href="/base" class="boton-secundario">Ver Plantilla Base</a>
        </div>
        <hr style="border: none; border-top: 1px solid var(--color-border); margin: 1.5rem 0;">
        <a href="/logout" style="color: var(--color-primary); font-weight: 600; text-decoration: none;">Cerrar Sesión</a>
    </main>
</body>
</html>
