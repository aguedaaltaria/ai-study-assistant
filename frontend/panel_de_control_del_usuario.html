<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Principal - StudyAI</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <main class="contenedor-principal contenedor-amplio">
        <h1 class="titulo-izquierda">Panel de Control</h1>
        <p class="texto-descriptivo">Bienvenido a tu espacio de estudio protegido por sesión.</p>
        
        <div class="grupo-botones">
            <a href="/cuestionario" class="boton-primario enlace-como-boton">Ir a Cuestionario</a>
            <a href="/base" class="boton-secundario">Ver Plantilla Base</a>
        </div>
        
        <hr class="divisor">
        
        <a href="/logout" class="enlace-logout">Cerrar Sesión</a>

        <!-- Contenedor puro HTML que será llenado dinámicamente por JavaScript -->
        <div class="contenedor-lista-cuestionarios">
            <h3 class="titulo-seccion-cuestionarios">Tus Cuestionarios Guardados</h3>
            <div id="lista-cuestionarios-dinamica" class="lista-flex">
                <p class="texto-vacio-cuestionarios">Cargando cuestionarios...</p>
            </div>
        </div>
    
        <!-- Formulario principal de Generación con IA -->
        <div class="tarjeta-formulario-interno">
            <h3>Generar Cuestionario con IA</h3>
            <form action="/generar-cuestionario-ia" method="POST">
                <div class="grupo-formulario">
                    <label for="titulo_cuestionario_ia">Tema o Materia a Estudiar:</label>
                    <input type="text" id="titulo_cuestionario_ia" name="titulo_cuestionario" placeholder="Ej. Criptografía simétrica y AES" required>
                </div>
                <button type="submit" class="boton-primario">Generar con Gemini IA</button>
            </form>
        </div>
        
    </main>
<script src="/js/script.js"></script>
</body>
</html>
