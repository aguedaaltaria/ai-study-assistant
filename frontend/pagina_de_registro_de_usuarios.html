<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - StudyAI</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <main class="contenedor-principal">
        <button id="btn-toggle-theme" class="boton-secundario">🌙 Modo Oscuro</button>
        <h1>Crear Cuenta</h1>
        <form action="/registro" method="POST">
            <div class="grupo-formulario">
                <label for="correo_electronico">Correo electrónico:</label>
                <input type="email" id="correo_electronico" name="correo_electronico" required>
            </div>
            <div class="grupo-formulario">
                <label for="contrasena">Contraseña:</label>
                <input type="password" id="contrasena" name="contrasena" required>
            </div>
            <button type="submit" class="boton-primario">Registrarse</button>
        </form>
        <p class="enlace-alternativo">¿Ya tienes cuenta? <a href="/login">Inicia sesión</a></p>
    </main>
    <script src="/js/theme.js"></script>
</body>
</html>
