<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario - Asistente de Estudio</title>
    <!-- Enlace a los estilos CSS -->
    <!-- <link rel="stylesheet" href="/css/estilos.css"> -->
</head>
<body>
    <main class="contenedor-principal">
        <h1>Registro de Usuario</h1>

        <form action="/registro" method="POST">
            <div class="grupo-formulario">
                <label for="correo_electronico">Correo electrónico:</label>
                <input type="email" id="correo_electronico" name="correo_electronico" required>
            </div>

            <div class="grupo-formulario">
                <label for="contrasena">Contraseña:</label>
                <input type="password" id="contrasena" name="contrasena" required>
            </div>

            <button type="submit" class="boton-primario">Registrarse</button>
        </form>

        <p class="enlace-alternativo">¿Ya tienes una cuenta? <a href="/login">Inicia sesión aquí</a></p>
    </main>

    <!-- Enlace a los scripts de JavaScript -->
    <!-- <script src="/js/script.js"></script> -->
</body>
</html>
